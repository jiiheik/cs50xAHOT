<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            // TODO: Add code to check answers to questions
            document.addEventListener('DOMContentLoaded', function() {

            let correct = document.querySelector('.correct');
            correct.addEventListener('click', function() {
                correct.style.backgroundColor = 'green';
                document.querySelector('#fb1').innerHTML = 'Correct';
});

            let incorrects = document.querySelectorAll('.incorrect');
            for (let i = 0; i < incorrects.length; i++) {
                incorrects[i].addEventListener('click', function() {
                    incorrects[i].style.backgroundColor = 'red';
                    document.querySelector('#fb1').innerHTML = 'Incorrect';
    });
}

            document.querySelector('#check').addEventListener('click', function() {
                let input = document.querySelector('input');
                if (input.value === 'Tampere') {
                    input.style.backgroundColor = 'green';
                    document.querySelector('#fb2').innerHTML = 'Correct';
            } else {
                input.style.backgroundColor = 'red';
                document.querySelector('#fb2').innerHTML = 'Incorrect';
            }
    });

});
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <!-- TODO: Add multiple choice question here -->
                <h3>What is the population of Norway?</h3>
                <button class="incorrect">4.3 million</button>
                <button class="correct">5.4 million</button>
                <button class="incorrect">7.1 million</button>
                <p id="fb1">
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <!-- TODO: Add free response question here -->
                <h3>What is the largest inland city in the Nordics in terms of population?</h3>
            <form>
                <input autocomplete="off" autofocus id ="city" placeholder="City" type="text"></input>
                <button id="check">Check Answer</button>
            </form>
                <p id="fb2">
            </div>
        </div>
    </body>
</html>
